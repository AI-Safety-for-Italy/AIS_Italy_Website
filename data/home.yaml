# Supporters Section
# Logos shown in the "Supported by" band at the bottom of the home page.
# To add one: drop the logo file in src/assets/img/supporters/ and point `logo`
# at it. Set `width` and `height` to the file's own intrinsic size so the
# browser reserves the right space while it loads; the CSS caps the rendered
# height at 88px, so a raster file should be twice that tall. A long, one-line
# wordmark looks far bigger than a stacked one at the same cap, so `max_height`
# (in px) lowers the cap for that logo alone.
#
# Coefficient Giving logo: Aarongertler, CC BY 4.0, via Wikimedia Commons
# https://commons.wikimedia.org/wiki/File:Coefficient_Logo_Green.png
supporters:
  - id: 1
    name: 'Coefficient Giving'
    url: 'https://www.coefficientgiving.org/'
    logo: '/assets/img/supporters/coefficient-giving.png'
    width: 456
    height: 176
