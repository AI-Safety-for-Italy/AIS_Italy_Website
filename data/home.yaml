# Mission Section
mission:
  problem_title: 'The Challenge'
  problem_title_it: 'La Sfida'
  problem_emoji: '⚠️'
  problem_description: "AI will soon radically transform our society, for better or worse. Experts broadly expect significant progress during our lifetimes, potentially achieving human-level intelligence.\n\nDigital systems with such capabilities would revolutionize every aspect of our society, making their safe development one of the most pressing challenges of our time."
  problem_description_it: "L'IA trasformerà presto radicalmente la nostra società, nel bene o nel male. Gli esperti si aspettano progressi significativi nel corso della nostra vita, fino a raggiungere potenzialmente un'intelligenza di livello umano.\n\nSistemi digitali con tali capacità rivoluzionerebbero ogni aspetto della società, rendendo il loro sviluppo sicuro una delle sfide più urgenti del nostro tempo."
  problem_cta_text: 'Explore the Issues'
  problem_cta_link: '/community/'

  solution_title: 'Our Solution'
  solution_title_it: 'La Nostra Soluzione'
  solution_emoji: '💡'
  solution_description: "We work to ensure AI is developed to benefit humanity's future. Through education, community building, and raising awareness, we create a network of people committed to safer AI development.\n\nWe organize courses, host events, and connect members with resources and opportunities in the rapidly growing AI safety field."
  solution_description_it: "Lavoriamo per garantire che l'IA sia sviluppata a beneficio del futuro dell'umanità. Attraverso formazione, costruzione della community e sensibilizzazione, creiamo una rete di persone impegnate per uno sviluppo dell'IA più sicuro.\n\nOrganizziamo corsi, ospitiamo eventi e mettiamo in contatto i membri con risorse e opportunità nel campo in rapida crescita dell'AI safety."
  solution_cta_text: 'Get Involved Today'
  solution_cta_link: '{{ site.forms.mailingList }}'

# Open call band on the home page, under the stats strip. Remove the block
# when the call closes and the band disappears. The buttons' links and labels
# come from data/mentorship.yaml.
# The texts are the mentorship team's official wording (see data/mentorship.yaml).
mentorship_call:
  title: 'AI Safety for Italy Mentorship Program'
  title_it: 'Programma di mentorship AI Safety for Italy'
  edition: 'First edition, winter 2026/27: from 15 December 2026 to 15 March 2027'
  edition_it: 'Prima edizione, inverno 2026/27: dal 15 dicembre 2026 al 15 marzo 2027'
  description: "The AI Safety for Italy mentorship program connects people who want to enter the field of AI safety, ethics and governance with people who already work in it, in Italy and abroad. The goal is to lower the barrier to entry for those who have no one around them working on AI safety, to produce concrete work that stays with the community, and to build lasting connections between people working in this field inside and outside Italy."
  description_it: "Il programma di mentorship di AI Safety for Italy mette in contatto chi vuole entrare nel campo della sicurezza, dell'etica e della governance dell'intelligenza artificiale con persone che ci lavorano già, in Italia e all'estero. L'obiettivo è abbassare la barriera d'ingresso per chi non ha nel proprio ambiente persone che si occupano di AI safety, produrre lavoro concreto che resti alla comunità e costruire connessioni durature tra chi lavora in questo campo dentro e fuori dall'Italia."
  mentee: 'Students, recent graduates, PhD students, professionals and researchers, but also people with other backgrounds. No experience in AI safety is required.'
  mentee_it: 'Studenti, neolaureati, dottorandi, professionisti e ricercatori, ma anche persone con altri percorsi. Non è richiesta esperienza in AI safety.'
  mentor: 'People with relevant experience in AI safety or AI governance, from universities, research, industry, policy or institutions. You do not need to be a senior figure: what matters is being able to offer competent, continuous support.'
  mentor_it: "Persone con esperienza rilevante in AI safety o governance dell'IA, da università, ricerca, industria, policy o istituzioni. Non serve essere figure senior: serve poter offrire un supporto competente e continuativo."

# Features Section
# The three "What we do" columns on the home page. `icon` names a symbol in
# src/components/icons.njk; `status`, optional, is the short line under each column.
features:
  - id: 1
    icon: 'graduation'
    title: 'Education'
    title_it: 'Formazione'
    description: 'Reading groups, seminars and a 12-week mentorship program that connects newcomers with people already working in AI safety, in Italy and abroad.'
    description_it: "Gruppi di lettura, seminari e un programma di mentorship di 12 settimane che mette in contatto chi inizia con persone che lavorano già nell'AI safety, in Italia e all'estero."
    status: 'Mentorship program · open call'
    status_it: 'Programma di mentorship · call aperta'
  - id: 2
    icon: 'users'
    title: 'Community'
    title_it: 'Community'
    description: 'In-person meetups across Italian cities, an active Discord and links to the international AI safety network.'
    description_it: "Meetup in presenza in diverse città italiane, un Discord attivo e collegamenti con la rete internazionale dell'AI safety."
  - id: 3
    icon: 'flask'
    title: 'Research & policy'
    title_it: 'Ricerca e policy'
    description: 'Working groups on technical safety (interpretability, evaluations, alignment) and on AI governance and policy.'
    description_it: "Gruppi di lavoro sulla sicurezza tecnica (interpretabilità, valutazioni, allineamento) e su governance e policy dell'IA."
    status: 'Open to all members'
    status_it: 'Aperti a tutti i membri'

