# AI Safety for Italy Mentorship Program — the /mentorship/ page, the open-call
# band on the home page and the announcement bar all read from here.
#
# The Italian texts are the official ones written by the mentorship team and
# must stay verbatim; the English texts are their translation. Change the
# wording only together with the team.

# The expression-of-interest form, shared by mentors and mentees.
links:
  interest_form: 'https://forms.gle/eopxRMZVf7gK5XPW7'

contact_email: 'aisafetyitalia@gmail.com'

# Partner organisation, shown as "In partnership with" on the mentorship page
# and in the open-call band on the home page. Remove the block to hide it.
partner:
  name: 'CePTE'
  full_name: 'Centro per le Politiche sulle Tecnologie Emergenti'
  url: 'https://www.cepte.it/'
  # Wordmark cropped from orgs/cepte.png without its trailing bar; dark ink on
  # transparent, inverted by CSS on the dark theme.
  logo: '/assets/img/orgs/cepte-wordmark.png'

# Shown as a pulsing "Open call" label while true.
call_open: true

title: 'AI Safety for Italy Mentorship Program'
title_it: 'Programma di mentorship AI Safety for Italy'
edition: 'First edition, winter 2026/27: from 15 December 2026 to 15 March 2027'
edition_it: 'Prima edizione, inverno 2026/27: dal 15 dicembre 2026 al 15 marzo 2027'
lede: "The AI Safety for Italy mentorship program connects people who want to enter the field of AI safety, ethics and governance with people who already work in it, in Italy and abroad. The goal is to lower the barrier to entry for those who have no one around them working on AI safety, to produce concrete work that stays with the community, and to build lasting connections between people working in this field inside and outside Italy."
lede_it: "Il programma di mentorship di AI Safety for Italy mette in contatto chi vuole entrare nel campo della sicurezza, dell'etica e della governance dell'intelligenza artificiale con persone che ci lavorano già, in Italia e all'estero. L'obiettivo è abbassare la barriera d'ingresso per chi non ha nel proprio ambiente persone che si occupano di AI safety, produrre lavoro concreto che resti alla comunità e costruire connessioni durature tra chi lavora in questo campo dentro e fuori dall'Italia."

# "Express your interest": the single call to action for both roles.
interest:
  title: 'Express your interest'
  title_it: 'Manifesta il tuo interesse'
  text: 'Would you like to be a mentor, or take part as a mentee? Fill in the expression of interest form.'
  text_it: 'Vuoi fare da mentor o partecipare come mentee? Compila la manifestazione di interesse.'
  button: 'Express your interest'
  button_it: 'Manifesta il tuo interesse'
  dates_button: 'Key dates'
  dates_button_it: 'Date principali'

# "In breve": the program at a glance, in the hero.
facts:
  - label: 'Duration'
    label_it: 'Durata'
    value: '12 weeks'
    value_it: '12 settimane'
  - label: 'Format'
    label_it: 'Modalità'
    value: 'Online, with optional in-person meetings agreed between mentor and mentee'
    value_it: 'Online, con eventuali incontri in presenza concordati tra mentor e mentee'
  - label: 'Cost'
    label_it: 'Costo'
    value: 'Free; participation is voluntary and unpaid'
    value_it: 'Gratuito; la partecipazione è volontaria e non retribuita'
  - label: 'Language'
    label_it: 'Lingua'
    value: 'Meetings in Italian or English, materials in Italian'
    value_it: 'Incontri in italiano o inglese, materiali in italiano'
  - label: 'Places'
    label_it: 'Posti'
    value: 'Between 10 and 20 in total'
    value_it: 'Tra 10 e 20 in totale'

# "Due percorsi". `with_partner: true` shows the "In collaboration with CePTE"
# label on a track.
tracks_title: 'Two tracks'
tracks_title_it: 'Due percorsi'
tracks:
  - title: 'Career orientation'
    title_it: 'Orientamento professionale'
    with_partner: true
    text: 'An individual track for those who want to find their way among study and career opportunities in AI safety and AI governance. Mentor and mentee meet regularly to talk about interests, skills to develop, study and job opportunities, networking and concrete next steps. No technical skills are needed.'
    text_it: "Un percorso individuale per chi vuole orientarsi tra le opportunità di studio e di carriera nell'AI safety e nella governance dell'IA. Mentor e mentee si incontrano regolarmente per parlare di interessi, competenze da sviluppare, opportunità di studio e lavoro, networking e prossimi passi concreti. Non servono competenze tecniche."
    commitment: 'At least 2 hours a week'
    commitment_it: 'Almeno 2 ore a settimana'
    outcome: 'A personal action plan'
    outcome_it: "Un piano d'azione personale"
  - title: 'AI safety projects'
    title_it: 'Progetti di AI safety'
    text: 'A hands-on track for those who already have a clear idea of their interests and want to gain experience on a real project, defined and supervised by one or more mentors. Projects may cover model interpretability and evaluation, governance and policy, AI ethics and other topics related to reducing the risks of advanced AI systems. For students, the project can become the basis of a thesis, subject to agreement with their university.'
    text_it: "Un percorso pratico per chi ha già un'idea chiara dei propri interessi e vuole fare esperienza su un progetto reale, definito e supervisionato da uno o più mentor. I progetti possono riguardare interpretabilità e valutazione dei modelli, governance e policy, etica dell'IA e altri temi legati alla riduzione dei rischi dei sistemi di IA avanzati. Per chi studia, il progetto può diventare la base di una tesi, previo accordo con la propria università."
    commitment: 'At least 8 hours a week'
    commitment_it: 'Almeno 8 ore a settimana'
    outcome: 'A concrete deliverable: report, scientific article, software, educational material'
    outcome_it: 'Un deliverable concreto: report, articolo scientifico, software, materiale educativo'

# "Chi può partecipare"
participants:
  title: 'Who can take part'
  title_it: 'Chi può partecipare'
  mentor:
    title: 'Mentors'
    title_it: 'Mentor'
    text: 'People with relevant experience in AI safety or AI governance, from universities, research, industry, policy or institutions. You do not need to be a senior figure: what matters is being able to offer competent, continuous support.'
    text_it: "Persone con esperienza rilevante in AI safety o governance dell'IA, da università, ricerca, industria, policy o istituzioni. Non serve essere figure senior: serve poter offrire un supporto competente e continuativo."
  mentee:
    title: 'Mentees'
    title_it: 'Mentee'
    text: 'Students, recent graduates, PhD students, professionals and researchers, but also people with other backgrounds. No experience in AI safety is required. If you do not meet all the requirements of a project you are interested in, apply anyway and explain why you think you could benefit from the track.'
    text_it: "Studenti, neolaureati, dottorandi, professionisti e ricercatori, ma anche persone con altri percorsi. Non è richiesta esperienza in AI safety. Se non soddisfi tutti i requisiti di un progetto che ti interessa, candidati comunque e spiega perché pensi di poter beneficiare dal percorso."
  requirements_title: 'Requirements for everyone'
  requirements_title_it: 'Requisiti per tutti'
  requirements:
    - text: 'having a connection with Italy, for example Italian citizenship, living in Italy, studying or working (now or in the past) at an organisation based in Italy. If you do not fit these examples, explain your connection in your application;'
      text_it: "avere un legame con l'Italia, per esempio cittadinanza italiana, vivere in Italia, studiare o lavorare (oggi o in passato) presso un ente con sede in Italia. Se non rientri in questi esempi, spiega il tuo legame nella candidatura;"
    - text: 'being at least 18 years old;'
      text_it: 'avere almeno 18 anni;'
    - text: 'having a time availability compatible with the chosen track;'
      text_it: 'avere una disponibilità oraria compatibile con il percorso scelto;'
    - text: "accepting the program's code of conduct."
      text_it: 'accettare il codice di condotta del programma.'
  note: 'You can take part alongside other programs (SPAR, BlueDot, ARENA, etc.).'
  note_it: 'È possibile partecipare in parallelo ad altri programmi (SPAR, BlueDot, ARENA, ecc.).'

