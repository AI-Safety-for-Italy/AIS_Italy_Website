# "Come si viene selezionati"
selection:
  title: 'How selection works'
  title_it: 'Come si viene selezionati'
  paragraphs:
    - text: 'Mentors are assessed on the relevance and feasibility of the proposed project and on their supervision ability. For the projects track, each mentor selects their own candidates, possibly with a short interview, and the final match takes into account the preferences of both sides. For the orientation track, matching is handled by AIS4I together with CePTE. The eligibility of all applications is assessed by the AIS4I team.'
      text_it: "I mentor sono valutati sulla rilevanza e la fattibilità del progetto proposto e sulla capacità di supervisione. Per il percorso progetti, ogni mentor seleziona i propri candidati, eventualmente con un breve colloquio, e l'abbinamento finale tiene conto delle preferenze di entrambe le parti. Per l'orientamento, l'abbinamento è curato da AIS4I insieme a CePTE. L'ammissibilità di tutte le candidature è valutata dal team AIS4I."
  ai_title: 'Use of AI in your application'
  ai_title_it: "Uso dell'IA nella candidatura"
  ai_text: 'The open answers must be written by you. You may use a language model to find your way among the projects, but not to write or polish your answers. Short, direct answers are perfectly fine.'
  ai_text_it: 'Le risposte aperte devono essere scritte da te. Puoi usare un modello linguistico per orientarti tra i progetti, ma non per scrivere o rifinire le risposte. Risposte brevi e dirette vanno benissimo.'

contact:
  title: 'Contacts'
  title_it: 'Contatti'
  text: 'Questions about the program? Write to us.'
  text_it: 'Domande sul programma? Scrivici.'

