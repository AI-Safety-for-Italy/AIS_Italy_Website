# Bilingual translations for EN/IT
# Structure: translations.en.key and translations.it.key
#
# Templates reach these two ways:
#   * visible text -> data-en="{{ translations.en.x }}" data-it="{{ translations.it.x }}",
#     resolved at build time by the "localize" transform in .eleventy.js
#   * attributes the build must resolve itself (aria-label, title) -> `t.x`,
#     which is already the active language (see src/content/content.11tydata.js)

