      name_it: 'Partner in Italia'
      icon: '🇮🇹'
      entries:
        - title: 'CePTE'
          country: 'Italy'
          country_it: 'Italia'
          flag: '🇮🇹'
          description: "Centro per le Politiche sulle Tecnologie Emergenti, an independent think tank producing evidence-based reports and policy recommendations on emerging technologies for Italian decision-makers."
          description_it: "Centro per le Politiche sulle Tecnologie Emergenti, un think tank indipendente che produce report e raccomandazioni di policy basati sull'evidenza sulle tecnologie emergenti per i decisori italiani."
          url: 'https://www.cepte.it/'
          logo: '/assets/img/orgs/cepte.png'
        - title: 'Effective Altruism Italia'
          country: 'Italy'
          country_it: 'Italia'
          flag: '🇮🇹'
          description: 'Altruismo Efficace Italia APS grows the Italian effective altruism community with educational programmes, career guidance, and events on how to do the most good, existential risks included.'
          description_it: "Altruismo Efficace Italia APS fa crescere la community italiana dell'altruismo efficace con programmi formativi, orientamento professionale ed eventi su come fare del bene nel modo più efficace, rischi esistenziali compresi."
