  - id: elia-torre
    name: 'Elia Torre'
    affiliation: 'ETH Zurich'
    photo: '/assets/img/mentors/elia-torre.jpg'
    links:
      website: 'https://eliatorre.com/'
    co_mentors: [goncalo-guiomar, michele-viscione]
    tracks: [projects]
    areas: [interpretability, evaluations, alignment]
    bio: 'PhD student in machine learning and computational neuroscience at ETH Zurich and the University of Zurich. He studies how biological and artificial neural systems learn, reason and make decisions, from the interpretability of recurrent networks to reasoning in language models and its relation to human cognition.'
    bio_it: "Dottorando in machine learning e neuroscienze computazionali all'ETH e all'Università di Zurigo. Studia come i sistemi neurali biologici e artificiali apprendono, ragionano e prendono decisioni, dall'interpretabilità delle reti ricorrenti al ragionamento nei modelli linguistici e al suo rapporto con la cognizione umana."
    project:
      title: 'Small Language Models of Human Cognition'
      title_it: 'Small Language Models of Human Cognition'
      summary: 'Bring small language models closer to how people reason, working across the whole training pipeline, from data to evaluation.'
      summary_it: "Avvicinare i piccoli modelli linguistici al modo in cui ragionano le persone, lavorando sull'intera filiera di addestramento, dai dati alla valutazione."
      description: |-
        Modern LLMs solve complex problems, often beyond human capabilities, but diverge from our abstractions and reasoning. This project aims to bring them closer to how people reason and behave, intervening across the entire training pipeline, from data to evaluation. Based on their skills and interests, participants will be assigned to one of four research areas:

        (1) Data. Collect and expand datasets on human behaviour, learning and language, developing scaling techniques.
        (2) Pre-training. Derive scaling laws for the pre-training of small LLMs, relating model size and data quantity and composition to cognitive alignment.
        (3) Mid- and Post-training. Develop mid- and post-training techniques that use human cognitive signals as training objectives.
        (4) Evaluation. Build protocols to measure models' cognitive processes at scale, from behaviour to internal representations.

        The four areas work closely together on shared data and protocols: the results of each feed into the work of the others.
      description_it: |-
        Gli LLM moderni risolvono problemi complessi, spesso oltre le capacità umane, ma divergono dalle nostre astrazioni e ragionamenti. Questo progetto vuole avvicinarli al modo in cui le persone ragionano e si comportano, intervenendo sull'intera filiera di addestramento, dai dati alla valutazione. In base a competenze ed interessi, i partecipanti verranno assegnati ad una delle quattro aree di ricerca:

        (1) Dati. Raccogliere ed ampliare dataset sul comportamento, sull'apprendimento e sul linguaggio umano, sviluppando tecniche di scaling.
        (2) Pre-training. Ricavare leggi di scala sul pre-training di piccoli LLM, mettendo in relazione dimensione del modello, quantità e composizione dei dati con l'allineamento cognitivo.
        (3) Mid- e Post-training. Sviluppare tecniche di mid- e post-training che usano segnali cognitivi umani come obiettivi di addestramento.
        (4) Evaluation. Costruire protocolli per misurare su larga scala i processi cognitivi dei modelli, dal comportamento alle rappresentazioni interne.

        Le quattro aree lavorano a stretto contatto, su dati e protocolli condivisi: i risultati di ciascuna alimentano il lavoro delle altre.
      mentee: 'Open to bachelor, master and PhD students and to professionals with a background in machine learning, cognitive science, neuroscience, linguistics or psychology. Useful skills, depending on the area: Python, PyTorch, CUDA, pre- and post-training of LLMs, cognitive science, evaluation and benchmarking, high-performance computing.'
      mentee_it: "Aperto a studenti di triennale, magistrale e dottorato e a professionisti con un background in machine learning, scienze cognitive, neuroscienze, linguistica o psicologia. Competenze utili, a seconda dell'area: Python, PyTorch, CUDA, pre- e post-training di LLM, scienze cognitive, valutazione e benchmarking, calcolo ad alte prestazioni."
      deliverable: 'A scientific article, a software package, a dataset and a blog post'
      deliverable_it: 'Un articolo scientifico, un pacchetto software, un dataset e un blogpost'
    language: 'Italian, English'
    language_it: 'Italiano, inglese'

