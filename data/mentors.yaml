# One entry per mentor, shown in this order.
#
#   id            unique, lowercase-with-dashes: the profile's link is
#                 /mentorship/#<id>
#   name          full name
#   role(_it)     optional: position, e.g. "PhD student"
#   affiliation   organisation
#   photo         optional; a square picture in src/assets/img/mentors/,
#                 at least 400x400. Without one the initials are shown.
#   links         optional: website, linkedin, scholar, github
#   tracks        ids of data/mentorship.yaml `tracks`: projects, orientation
#   areas         ids of `research_areas` above
#   bio(_it)      two or three sentences about the mentor
#   project       for the projects track: title, summary (one or two lines,
#                 shown on the card), description (the full text), mentee
#                 (who it is for) and deliverable, each with its _it
#   orientation   for the orientation track: what the mentor can help with
#   co_mentors    optional: ids of the mentors who supervise the same project.
#                 Each of them is a separate entry listing the others here;
#                 write the `project` on one of them only, the others show it
#                 too. Their cards get a "Co-mentor" label on top.
#   places        optional: how many mentees the mentor takes
#   language      optional: meeting language(s)
mentors:
  - id: lorenzo-pacchiardi
    name: 'Lorenzo Pacchiardi'
    affiliation: 'University of Cambridge'
    photo: '/assets/img/mentors/lorenzo-pacchiardi.jpg'
    links:
      website: 'https://www.lorenzopacchiardi.me/'
    tracks: [projects]
    areas: [evaluations, governance, society]
    bio: 'Assistant Research Professor at the Leverhulme Centre for the Future of Intelligence, University of Cambridge, and Research Scientist at Apart Research. He sits on the AI Act scientific panel, which advises the EU AI Office on the risks of general-purpose AI models, and develops evaluations of harmful manipulation.'
    bio_it: "Assistant Research Professor al Leverhulme Centre for the Future of Intelligence dell'Università di Cambridge e Research Scientist ad Apart Research. Fa parte del panel scientifico dell'AI Act, che consiglia l'Ufficio europeo per l'IA sui rischi dei modelli per finalità generali, e sviluppa valutazioni sui rischi di manipolazione."
    project:
      title: 'Evaluation of AI chatbot responses to questions from Italian voters ahead of the 2027 elections'
      title_it: 'Valutazione delle risposte dei chatbot di IA alle domande degli elettori italiani in vista delle elezioni del 2027'
      summary: 'A dataset of realistic voter questions in Italian to test how accurate, up to date and balanced the main chatbots are before the 2027 elections.'
      summary_it: 'Un dataset di domande realistiche di elettori in italiano per verificare quanto i principali chatbot siano accurati, aggiornati ed equilibrati prima delle elezioni del 2027.'
      description: 'A growing number of citizens turn to chatbots based on Large Language Models (LLMs) to inform themselves about political topics, including parties, candidates, and how votes are cast and counted. Errors, omissions or imbalances in these responses may affect turnout and electoral choices, with effects that are hard to observe from the outside. 2027 will be an important election year for Italy. Between April and May, more than 2,000 municipalities will hold local elections, including Rome, Milan, Turin, Naples and Bologna. The general election is expected by the autumn and will be held under an electoral law approved only in October 2026. Many models may thus be unaware of it, and the reform offers a natural testbed for the problem of outdated information. The project builds a set of realistic questions in Italian, inspired by those of ordinary voters, covering voting procedures, deadlines and the electoral system. With these questions, we evaluate the main publicly accessible chatbots along four criteria: factual accuracy, up-to-dateness, quality of the cited sources, and political balance. The results and the dataset will be made public before the vote, to inform citizens, journalists and oversight authorities (AGCOM, the European AI Office) about the risks and limitations of these tools during election campaigns.'
      description_it: "Un numero crescente di cittadini si rivolge ai chatbot basati su modelli linguistici di grandi dimensioni (LLM) per informarsi su temi politici, inclusi partiti, candidati, modalità di voto e di conteggio. Errori, omissioni o sbilanciamenti in queste risposte possono influenzare la partecipazione e le scelte elettorali, con effetti difficili da osservare dall'esterno. Il 2027 sarà un anno elettorale importante per l'Italia. Tra aprile e maggio si voterà nelle amministrative di oltre 2.000 Comuni, tra cui Roma, Milano, Torino, Napoli e Bologna. Le elezioni politiche sono attese entro l'autunno e si svolgeranno con una legge elettorale approvata solo nell'ottobre 2026. Molti modelli potrebbero quindi non conoscerla, e la riforma offre un banco di prova naturale per il problema delle informazioni obsolete. Il progetto costruisce un insieme di domande realistiche in italiano, ispirate a quelle di elettori comuni. Le domande riguardano procedure di voto, scadenze e sistema elettorale. Con queste domande valutiamo i principali chatbot accessibili al pubblico secondo quattro criteri: accuratezza fattuale, aggiornamento, qualità delle fonti citate ed equilibrio politico. I risultati e il dataset saranno resi pubblici prima del voto, per informare cittadini, giornalisti e autorità di vigilanza (AGCOM, Ufficio europeo per l'IA) sui rischi e sui limiti di questi strumenti in campagna elettorale."
      mentee: 'Programming in Python and some knowledge of how LLMs and their evaluation work. Knowledge of the Italian electoral system is a plus.'
      mentee_it: 'Programmazione in Python e qualche conoscenza del funzionamento degli LLM e della loro valutazione. La conoscenza del sistema elettorale italiano è un plus.'
      deliverable: 'A scientific article or a blog post'
      deliverable_it: 'Un articolo scientifico o un blogpost'
    language: 'Italian, English'
    language_it: 'Italiano, inglese'

  - id: stefano-vergani
    name: 'Stefano Vergani'
    affiliation: "King's College London, GovAI"
    photo: '/assets/img/mentors/stefano-vergani.jpg'
    links:
      linkedin: 'https://www.linkedin.com/in/stefano-vergani-b2a931238/'
    tracks: [projects]
    areas: [governance, security]
    bio: 'A particle physicist working on edge AI and quantum AI, he also works on AI safety and national security: at GovAI on the impact of AI on nuclear deterrence, and at ERA as a resident fellow on hardware verification. He supervises a team at SPAR on AI risks to satellites and advises a member of the UK House of Lords on science and AI safety.'
    bio_it: "Fisico delle particelle, lavora su edge AI e quantum AI e si occupa di AI safety e sicurezza nazionale: a GovAI studia l'impatto dell'IA sulla deterrenza nucleare, a ERA è resident fellow su progetti di hardware verification. Supervisiona un team di SPAR sui rischi dell'IA per i satelliti e consiglia un membro della House of Lords britannica su scienza e AI safety."
    project:
      title: 'Risks of AI Use in the Italian Security Sector'
      title_it: "Rischi nell'utilizzo di IA nel comparto sicurezza italiano"
      summary: 'A comparative analysis and a taxonomy of the risks of AI in policing, investigations and intelligence, with concrete incident scenarios.'
      summary_it: "Un'analisi comparativa e una tassonomia dei rischi dell'IA in polizia, indagini e intelligence, con scenari concreti di incidente."
      description: 'This project analyzes the risks associated with the use of AI within the Italian security sector, with a particular focus on investigative activities, data analysis, and intelligence. The first part of the work presents a comparative analysis of how AI is employed by police forces in major European countries, identifying trends and incidents. The second part develops a taxonomy of specific risks and potential harms. Factors to be considered include, for example, predictive biases, hallucinations, loss of control, and cyberattacks specifically targeting AI models and data. The project also examines "power concentration risks", that is, the potential for AI to be used to consolidate power or carry out coups d''état. The project concludes with a series of scenarios, examples and descriptions of potential incidents designed to provide a concrete illustration of the risks discussed. The project is technical and apolitical in nature, aiming to inform decision-makers in the security sector about the potential risks arising from the use of AI in their field.'
      description_it: 'Questo progetto analizza i rischi relativi all''utilizzo di IA nel comparto della sicurezza italiano, con particolare focus sulle attività di indagine, analisi dei dati e intelligence. La prima parte del lavoro presenta un''analisi comparativa dell''uso dell''IA da parte delle forze di polizia nei principali paesi europei, identificando tendenze e incidenti. La seconda parte si occupa di creare una tassonomia di rischi specifici e possibili danni. Elementi che verranno presi in considerazione saranno, per esempio, bias predittivi, allucinazioni, perdita di controllo e possibili cyberattacchi specifici ai modelli e ai dati. Verranno anche presi in considerazione i cosiddetti "power concentration risks", ovvero verrà valutata la possibilità di usare l''IA per concentrare il potere o compiere colpi di stato. Il progetto terminerà con una serie di scenari, ovvero esempi e descrizioni di possibili incidenti per mostrare in maniera concreta i rischi descritti. Il progetto è di natura apolitica e tecnica e ha come finalità quella di informare i decisori nel comparto della sicurezza sui possibili rischi derivanti dall''utilizzo di IA nel loro campo.'
      mentee: 'A balanced team: ideally at least one mentee with a background in defence and law enforcement, law or political science, and one with a technical background and an understanding of how AI works. Research experience, some independence and an impartial, apolitical approach are essential, as is professional English.'
      mentee_it: "Un team bilanciato: idealmente almeno un mentee con esperienza nella difesa e nelle forze dell'ordine, in giurisprudenza o scienze politiche, e uno con un background tecnico e una conoscenza del funzionamento dell'IA. Sono essenziali esperienza di ricerca, un certo grado di autonomia, un approccio imparziale e apolitico e un inglese di livello professionale."
      deliverable: 'A scientific article or a blog post, possibly a journal article or a policy report for an Italian audience'
      deliverable_it: 'Un articolo scientifico o un blogpost, possibilmente un articolo su rivista o un policy report per un pubblico italiano'
    language: 'Italian, English'
    language_it: 'Italiano, inglese'

  - id: emanuele-marconato
    name: 'Emanuele Marconato'
    affiliation: 'University of Copenhagen'
    photo: '/assets/img/mentors/emanuele-marconato.jpg'
    links:
      website: 'https://emanuele-marconato.github.io/'
    co_mentors: [luigi-gresele]
    tracks: [projects]
    areas: [interpretability, alignment]
    bio: 'Postdoc in the Department of Mathematical Sciences at the University of Copenhagen. He holds a PhD from the University of Trento on explainable AI, neuro-symbolic AI and representation learning, and works on the theory of mechanistic interpretability and on evaluating the representations of neural models.'
    bio_it: "Postdoc al Dipartimento di Scienze Matematiche dell'Università di Copenaghen. Ha conseguito il dottorato all'Università di Trento su explainable AI, IA neuro-simbolica e representation learning, e lavora sugli aspetti teorici della mechanistic interpretability e sulla valutazione delle rappresentazioni dei modelli neurali."
    project:
      title: 'Leveraging relational linear properties to steer language model generation'
      title_it: 'Proprietà relazionali lineari per il controllo della generazione nei modelli linguistici'
      summary: 'Use the relational linear properties found inside language models, which need no external annotation, to build a new steering technique.'
      summary_it: 'Usare le proprietà relazionali lineari interne ai modelli linguistici, che non richiedono annotazioni esterne, per costruire una nuova tecnica di steering.'
      description: |-
        Controlling language model generation is a central topic in AI safety and Mechanistic Interpretability. Current techniques use supervised probes to detect and then select the region of neuron activations to act on to achieve controlled generation, but this requires gathering external annotations on several linguistic properties.

        Relational linear properties of language models, in contrast, can be detected within the model internal computations and do not require external annotation.

        The project will focus on relational linearity as a new tool for representational steering. The final goal of the project is to build a new steering technique and then to evaluate the model generation through representational control.
      description_it: |-
        Il controllo della generazione di output nei modelli linguistici rappresenta un tema centrale nell'ambito della sicurezza dell'intelligenza artificiale e della mechanistic interpretability. Le tecniche attuali si avvalgono di probes supervisionate per identificare e selezionare specifiche attivazioni neurali su cui intervenire, consentendo così di controllare la generazione; tuttavia, tale approccio richiede la raccolta di annotazioni esterne relative a diverse proprietà linguistiche.

        Al contrario, le proprietà relazionali lineari dei modelli linguistici possono essere rilevate direttamente all'interno dei calcoli interni del modello, senza la necessità di annotazioni esterne.

        Questo progetto si concentrerà sulla linearità relazionale come strumento innovativo per il controllo delle rappresentazioni ("representational steering"). L'obiettivo finale è sviluppare una nuova tecnica di controllo e, successivamente, valutare la generazione di output del modello attraverso la manipolazione delle sue rappresentazioni interne.
      mentee: 'Basic probability and statistics, linear algebra and functional analysis, and good familiarity with Python and GitHub. No previous research projects or publications needed.'
      mentee_it: 'Conoscenze di base di probabilità e statistica, algebra lineare e analisi funzionale, e buona familiarità con Python e GitHub. Non è necessario aver già svolto progetti di ricerca o pubblicato articoli.'
      deliverable: 'A scientific article and a software package'
      deliverable_it: 'Un articolo scientifico e un pacchetto software'
    language: 'Italian, English'
    language_it: 'Italiano, inglese'

