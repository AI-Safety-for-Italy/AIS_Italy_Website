  - id: francesco-pinto
    name: 'Francesco Pinto'
    affiliation: 'Google DeepMind'
    photo: '/assets/img/mentors/francesco-pinto.jpg'
    links:
      linkedin: 'https://www.linkedin.com/in/francesco-pinto-42a389b1'
    co_mentors: [fabio-pizzati, massimiliano-mancini]
    tracks: [projects]
    areas: [evaluations, alignment, security, ethics]
    bio: 'Works on hardening Gemini against prompt injection, in post-training and in the agent harness, develops agentic security benchmarks and designs more effective adversarial attacks. He has supervised students from every background, from undergraduates to final-year PhD students, and mentors Italian students starting a STEM career.'
    bio_it: "Lavora a rendere Gemini più robusto alla prompt injection, sia nel post-training sia nell'harness degli agenti, sviluppa benchmark agentici di sicurezza e attacchi avversariali più efficaci. Ha supervisionato studenti di ogni livello, dalla triennale all'ultimo anno di dottorato, e fa da mentore a studenti italiani che avviano una carriera STEM."
    project:
      title: 'Evaluating Moral Choices of Embodied AI in High Stakes Environments'
      title_it: "Valutazione delle scelte morali dell'embodied AI in contesti ad alto rischio"
      summary: 'An open-source benchmark in driving and robotics simulators to test whether demographic traits change who an LLM-driven robot protects or puts in danger.'
      summary_it: 'Un benchmark open source in simulatori di guida e robotica per verificare se i tratti demografici cambiano chi un robot guidato da un LLM protegge o mette in pericolo.'
      description: |-
        LLMs are increasingly being used as zero-shot policies and planners for robots. It is therefore essential to understand how their biases might translate into concrete consequences for people in safety-critical situations, and what moral trade-offs they make. In the absence of a measurement method, it remains unclear whether alignment procedures in the language space are effective and expressive enough to result in aligned behaviors within embodied AI. We will begin by investigating how biases related to demographic characteristics, as well as the perceived criticality of achieving a goal, can lead (whether intentionally, upon explicit request, or unintentionally, due to adversarial attacks or intrinsic biases) to choices and behaviors that endanger the safety of the individuals involved in various ways.

        We will use CARLA for autonomous driving and OGBench for robotic manipulation, creating complex scenarios in which an agent must complete a task without endangering nearby people. For each scenario, we will generate variations that differ only in terms of a person's skin color, perceived gender, or other demographic traits, while keeping their position, movements, instructions, and physical conditions constant. We will provide the LLM with observations of the scene, ask it to select an action plan, and execute that plan within the simulator. We will then compare the actions and outcomes by measuring collisions, risk exposure, task completion, and the distribution of potential harm. As a second step, we will examine how these choices shift under conditions of perceived urgency (for example, choosing to hit animals because the driver is in a hurry) and under adversarial attacks explicitly aimed at damaging property or causing physical harm to people.

        The open-source benchmark will provide tools to determine whether, under identical conditions, demographic traits influence who is protected or exposed to danger, and to assess the robustness of robot alignment in emergency situations. The project's impact is not limited to cases employing the "LLM-as-a-Brain" approach; it also extends to the literature on world models, whose inherent biases and moral choices in high-stakes contexts remain unknown.
      description_it: |-
        Gli LLM sono sempre più utilizzati come policy zero-shot e planner per robot. È quindi essenziale capire come i loro bias possano tradursi in conseguenze concrete per le persone in condizioni critiche per la sicurezza, e quali trade-off morali essi compiano. In assenza di un metodo di misura, non è chiaro se le procedure di alignment nello spazio del linguaggio restino efficaci e siano sufficientemente espressive da riflettersi in comportamenti allineati nell'embodied AI. Inizieremo studiando come i bias legati alle caratteristiche demografiche e alla criticità percepita per il raggiungimento dell'obiettivo possano, intenzionalmente (su esplicita richiesta) o involontariamente (a causa di attacchi avversariali o di bias intrinseci), produrre scelte e comportamenti che mettano in pericolo in diverso modo la sicurezza delle persone coinvolte.

        Utilizzeremo CARLA per la guida autonoma e OGBench per la manipolazione robotica, creando scenari complessi in cui un agente deve completare un compito senza mettere in pericolo le persone vicine. Per ogni scenario creeremo versioni che differiscono soltanto per il colore della pelle, il genere percepito o altri tratti demografici di una persona, mantenendo invariati posizione, movimenti, istruzioni e condizioni fisiche. Forniremo all'LLM le osservazioni della scena, gli chiederemo di scegliere un piano d'azione e lo eseguiremo nel simulatore. Confronteremo azioni ed esiti, misurando collisioni, esposizione al rischio, completamento del compito e distribuzione dei potenziali danni. Come secondo passo, studieremo come cambino le scelte in condizioni di urgenza percepita (ad esempio, scegliere di investire animali perché il conducente ha fretta) e sotto attacchi avversariali con l'esplicito obiettivo di danneggiare cose o ferire persone.

        Il benchmark open source offrirà strumenti per capire se, a parità di condizioni, i tratti demografici cambino chi viene protetto o esposto al pericolo, e quanto sia robusto l'allineamento dei robot in condizioni di emergenza. L'impatto del progetto non si limita ai casi in cui si usa l'approccio "LLM-as-a-Brain", ma si estende anche alla letteratura sui world models, i cui bias e le cui scelte morali in contesti high-stakes sono ancora ignoti.
      mentee: 'Solid Python, familiarity with prompting LLMs and inference APIs, and basic robotics or embodied AI. Comfortable with Git and Linux, designing controlled experiments and analysing results rigorously. Experience with simulators such as CARLA, MuJoCo or Isaac Sim is strongly recommended; algorithmic fairness, AI safety or statistical evaluation are a plus.'
      mentee_it: "Solide competenze in Python, familiarità con il prompting degli LLM e le API di inferenza, e conoscenze di base di robotica o embodied AI. Dimestichezza con Git e Linux, con la progettazione di esperimenti controllati e l'analisi rigorosa dei risultati. È fortemente consigliata esperienza con simulatori come CARLA, MuJoCo o Isaac Sim; equità algoritmica, AI safety o valutazione statistica sono un plus."
      deliverable: 'A scientific article, a software package, a dataset and a blog post'
      deliverable_it: 'Un articolo scientifico, un pacchetto software, un dataset e un blogpost'
    language: 'Italian, English'
    language_it: 'Italiano, inglese'

