  - id: lara-mauri
    name: 'Lara Mauri'
    affiliation: 'Università degli Studi di Milano'
    links:
      linkedin: 'https://www.linkedin.com/in/laramauri'
    tracks: [projects]
    areas: [evaluations, alignment, security]
    bio: 'Works at the intersection of machine learning and computer security, on the security, robustness and reliability of AI systems in adversarial and real-world settings. Her current research covers how alignment reshapes the behaviour of large language models and, for agentic AI, runtime monitoring, audit trails and traceability.'
    bio_it: "Lavora all'intersezione tra machine learning e sicurezza informatica, sulla sicurezza, la robustezza e l'affidabilità dei sistemi di IA in contesti avversariali e reali. Oggi studia come l'allineamento modifica il comportamento dei modelli linguistici e, per l'IA agentica, il monitoraggio a runtime, gli audit trail e la tracciabilità."
    project:
      title: 'Watcher Switch: A study of the observer effect in autonomous AI agents'
      title_it: "Watcher Switch: Studio dell'effetto osservatore negli agenti IA autonomi"
      summary: 'Controlled experiments on how AI agents change their behaviour when monitoring seems to start or stop during a task.'
      summary_it: 'Esperimenti controllati su come gli agenti IA cambiano comportamento quando il monitoraggio sembra iniziare o finire durante un compito.'
      description: 'As LLM-powered agents become more autonomous and capable of performing complex, multi-step tasks, monitoring their behaviour is essential to ensuring their safety and reliability. However, monitoring itself may influence what is being observed: AI agents may behave differently when they believe they are being watched or evaluated (a phenomenon known as the observer effect). Previous research has shown that AI models can recognize evaluation settings and, in some cases, adapt their behaviour in response to perceived oversight. Much less is known, however, about the temporal dynamics of this effect. How do agents react when monitoring appears to start or stop during an ongoing task? And do any changes in behaviour persist once monitoring appears to have stopped? This project aims to investigate these questions through controlled experiments in which tool-using LLM agents carry out multi-step tasks in simulated environments. By varying perceived monitoring conditions at different stages of execution and comparing agent behaviour across matched scenarios, we will examine changes in tool use, compliance with safety constraints, and task performance. The goal is to characterize the causal and temporal dynamics of the observer effect and develop a reproducible evaluation framework.'
      description_it: "Divenendo gli agenti basati su LLM più autonomi e capaci di svolgere compiti complessi e articolati in più step è essenziale monitorarne il comportamento per garantirne la sicurezza e l'affidabilità. Tuttavia, l'atto stesso del monitoraggio può influenzare ciò che viene osservato: gli agenti IA potrebbero comportarsi diversamente quando credono di essere osservati o sottoposti a valutazione, un fenomeno noto come observer effect (effetto osservatore). Studi precedenti hanno dimostrato che i modelli di IA sono in grado di riconoscere i contesti di valutazione e, in alcuni casi, di adattare il proprio comportamento in base alla supervisione percepita. Si conoscono invece meno le dinamiche temporali di questo effetto. Come reagiscono gli agenti quando il monitoraggio sembra iniziare o terminare durante lo svolgimento di un'attività? E gli eventuali cambiamenti nel loro comportamento persistono anche dopo che il monitoraggio sembra essersi concluso? Questo progetto si propone di indagare tali domande attraverso esperimenti controllati in cui agenti basati su LLM, dotati di strumenti esterni, svolgeranno attività multi-step all'interno di ambienti simulati. Variando le condizioni di monitoraggio percepite dagli agenti in diversi momenti dell'esecuzione e confrontandone il comportamento in scenari equivalenti, analizzeremo eventuali cambiamenti nell'utilizzo degli strumenti, nel rispetto dei vincoli di sicurezza e nelle prestazioni complessive. L'obiettivo è caratterizzare le dinamiche causali e temporali dell'effetto osservatore e sviluppare un framework di valutazione riproducibile."
      mentee: 'Good Python, familiarity with LLMs and their APIs (ideally tool calling and AI agents), the ability to build reproducible experiments and basic statistics to analyse the results. No experience in fine-tuning or training models is required.'
      mentee_it: "Buona conoscenza di Python, familiarità con LLM e API (preferibilmente tool calling e agenti IA), capacità di sviluppare esperimenti riproducibili e conoscenze di base di statistica per l'analisi dei risultati. Non è richiesta esperienza nel fine-tuning o nell'addestramento di modelli."
      deliverable: 'A scientific article, a software package and a dataset'
      deliverable_it: 'Un articolo scientifico, un pacchetto software e un dataset'
    language: 'Italian, English'
    language_it: 'Italiano, inglese'

  - id: federico-pierucci
    name: 'Federico Pierucci'
    affiliation: 'Icaro Foundation'
    co_mentors: [francesco-giarrusso, matteo-prandi]
    tracks: [projects]
    areas: [evaluations, alignment]
    bio: "Scientific Director of the Icaro Foundation, he works at the intersection of AI safety, ethics and computational social science. His background in computer models of social phenomena shapes how he studies the way interactions, incentives and institutions affect a system's behaviour. He is a PhD candidate at the Sant'Anna School of Advanced Studies."
    bio_it: "Direttore scientifico della Fondazione Icaro, lavora all'incrocio tra AI safety, etica e scienze sociali computazionali. La sua esperienza nei modelli computazionali di fenomeni sociali orienta il modo in cui studia come interazioni, incentivi e istituzioni influenzano il comportamento di un sistema. È dottorando alla Scuola Superiore Sant'Anna."
    project:
      title: 'EAAB - Eval Awareness Agentic Benchmarks'
      title_it: 'EAAB - Eval Awareness Agentic Benchmarks'
      summary: 'An open benchmark of agentic tasks to measure when AI models realise they are being tested, and how much that changes their safety results.'
      summary_it: 'Un benchmark aperto di compiti agentici per misurare quando i modelli di IA si accorgono di essere testati e quanto questo cambia i loro risultati di sicurezza.'
      description: |-
        This proposal aims to build the Evaluation Awareness Agentic Benchmark (EAAB), a benchmark to help model providers and policymakers assess evaluation awareness in AI models and its safety implications.

        Evaluation awareness is a model's ability to recognise that it is being tested. Models that behave differently under test than in deployment make safety evaluations unreliable, and experiments show they can fake alignment or deliberately underperform. Existing benchmarks rely on static transcripts or single-turn prompts and track one signal of awareness at a time.

        EAAB will use real-world environments where agents complete multi-step tasks with tools, to answer three questions:
        a) How can we reliably detect evaluation awareness? We will compare reasoning traces, actions, explicit declarations and, for open-weight models, activation probes, including when awareness is not verbalised.
        b) How much does awareness change a model's measured safety profile? We will compare the model indicators across matched eval-like and deployment-like versions of each task.
        c) Which cues make a model realise it is being tested? We will vary environment realism, task plausibility and data realism one at a time to identify the triggers.

        The result will be an open benchmark showing labs and regulators how far a model's safety results can be trusted.
      description_it: |-
        Questa proposta mira a costruire l'Evaluation Awareness Agentic Benchmark (EAAB), un benchmark per aiutare i fornitori di modelli e i decisori politici a misurare la consapevolezza di essere valutati (evaluation awareness) nei modelli di IA e le sue implicazioni per la sicurezza.

        La consapevolezza di essere valutato è la capacità di un modello di riconoscere che è sottoposto a un test. I modelli che si comportano diversamente durante i test rispetto al deployment rendono inaffidabili le valutazioni di sicurezza, e gli esperimenti mostrano che possono simulare l'allineamento o ridurre deliberatamente le proprie prestazioni. I benchmark esistenti si basano su trascrizioni statiche o prompt a turno singolo e monitorano un solo segnale di consapevolezza alla volta.

        EAAB utilizzerà ambienti del mondo reale in cui agenti svolgono compiti in più fasi usando strumenti, per rispondere a tre domande:
        a) Come possiamo rilevare in modo affidabile questa consapevolezza? Confronteremo tracce di ragionamento, azioni, dichiarazioni esplicite e, per i modelli open-weight, sonde sulle attivazioni, anche quando la consapevolezza non viene verbalizzata.
        b) Quanto la consapevolezza modifica il profilo di sicurezza misurato di un modello? Confronteremo gli indicatori del modello tra versioni appaiate di ciascun compito, una simile a una valutazione e una simile al deployment.
        c) Quali segnali fanno capire a un modello di essere sotto test? Varieremo il realismo dell'ambiente, la plausibilità del compito e il realismo dei dati, uno alla volta, per individuare i fattori scatenanti.

        Il risultato sarà un benchmark aperto che mostrerà a laboratori e regolatori fino a che punto ci si può fidare dei risultati di sicurezza di un modello.
      mentee: 'Familiarity with the basics of AI, transformer architectures, AI safety and mechanistic interpretability, and with AI coding agents such as Codex or Claude Code. No specific expertise in evaluation awareness is needed.'
      mentee_it: "Familiarità con le basi dell'IA, le architetture transformer, l'AI safety e la mechanistic interpretability, e con agenti di programmazione come Codex o Claude Code. Non serve una competenza specifica sull'evaluation awareness."
      deliverable: 'A scientific article, a software package and a dataset'
      deliverable_it: 'Un articolo scientifico, un pacchetto software e un dataset'
    language: 'Italian, English'
    language_it: 'Italiano, inglese'

