  - id: 4
    anchor: 'meetup-milano-2026'
    category: 'seminar'
    title: 'AI Safety for Italy Meetup'
    title_it: 'Meetup AI Safety for Italy'
    date: 'Monday 5 October 2026, 18:00–20:30'
    date_it: 'Lunedì 5 ottobre 2026, 18:00–20:30'
    status: 'Upcoming'
    status_it: 'In arrivo'
    description: "The first in-person meetup of the AI Safety for Italy community, active since January 2026 and now over 50 members strong. The evening has three goals: <strong>meet each other face to face</strong> for the first time, <strong>introduce AI safety to newcomers</strong> and bring more people into the field, and <strong>present what we are building</strong>: the mentorship program, the new local groups in Milan, Turin, Trento, Padua and Genoa, the seminar series and the podcast. The talks will also be <strong>streamed online</strong>. Then the aperitivo, with time to talk research, policy and AI ethics over a drink. Milan is easy to reach and home to Statale, Politecnico, Bicocca and Bocconi: if you study or work in AI there, this evening is for you."
    description_it: "Il primo meetup in presenza della community AI Safety for Italy, attiva da gennaio 2026 e oggi con più di 50 membri. La serata ha tre obiettivi: <strong>incontrarci di persona</strong> per la prima volta, <strong>avvicinare all'AI safety chi ancora non la conosce</strong> e portare più persone nel campo, e <strong>presentare i progetti in cantiere</strong>: il programma di mentorship, i nuovi gruppi locali di Milano, Torino, Trento, Padova e Genova, il ciclo di seminari e il podcast. Gli interventi saranno <strong>trasmessi anche online</strong>. Poi l'aperitivo, con il tempo per parlare di ricerca, policy ed etica dell'IA davanti a un drink. Milano è facile da raggiungere e ospita Statale, Politecnico, Bicocca e Bocconi: se studi o lavori nell'IA lì, questa serata è per te."
    format_info:
      - label: 'Format'
        label_it: 'Formato'
        value: 'In person, talks also streamed online'
        value_it: 'In presenza, interventi anche in streaming'
      - label: 'Where'
