    title: 'AI Safety for Italy Mentorship Program: Open Call'
    title_it: 'Programma di mentorship AI Safety for Italy: call aperta'
    date: 'First edition, 15 December 2026 – 15 March 2027'
    date_it: 'Prima edizione, 15 dicembre 2026 – 15 marzo 2027'
    status: 'Open call'
    status_it: 'Call aperta'
    # Official wording from the mentorship team, kept in sync with data/mentorship.yaml.
    description: "The AI Safety for Italy mentorship program connects people who want to enter the field of AI safety, ethics and governance with people who already work in it, in Italy and abroad. The goal is to lower the barrier to entry for those who have no one around them working on AI safety, to produce concrete work that stays with the community, and to build lasting connections between people working in this field inside and outside Italy."
    description_it: "Il programma di mentorship di AI Safety for Italy mette in contatto chi vuole entrare nel campo della sicurezza, dell'etica e della governance dell'intelligenza artificiale con persone che ci lavorano già, in Italia e all'estero. L'obiettivo è abbassare la barriera d'ingresso per chi non ha nel proprio ambiente persone che si occupano di AI safety, produrre lavoro concreto che resti alla comunità e costruire connessioni durature tra chi lavora in questo campo dentro e fuori dall'Italia."
    format_info:
      - label: 'Tracks'
        label_it: 'Percorsi'
        value: 'Career orientation (with CePTE) or AI safety projects'
        value_it: 'Orientamento professionale (con CePTE) o progetti di AI safety'
      - label: 'Duration'
        label_it: 'Durata'
        value: '12 weeks, online'
        value_it: '12 settimane, online'
      - label: 'Places'
        label_it: 'Posti'
        value: 'Between 10 and 20 in total'
        value_it: 'Tra 10 e 20 in totale'
      - label: 'Expression of interest'
        label_it: 'Manifestazione di interesse'
        value: 'Open now; mentor applications close 20 October 2026, mentee applications open 1 November 2026'
        value_it: 'Aperta ora; chiusura candidature mentor 20 ottobre 2026, apertura candidature mentee 1 novembre 2026'
    register_text: 'Tracks, requirements and key dates'
    register_text_it: 'Percorsi, requisiti e date principali'
    register_link: '/mentorship/'
    register_target: '_self'

