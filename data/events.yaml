# Initiatives Page Content Data

hero:
  title: 'Initiatives'
  title_it: 'Iniziative'
  subtitle: 'Our programs and gatherings: mentorship, seminars and events.'
  subtitle_it: 'I nostri programmi e incontri: mentorship, seminari ed eventi.'

# Initiatives has three subpages, also listed under "Initiatives" in the menu.
# Each entry below is sorted onto one of them by its `category`:
#   mentorship  /mentorship/ (its content is in data/mentorship.yaml; the
#               entry here feeds the home page hero card)
#   seminar     /seminars/: the seminar series, registration on Luma
#   event       /events/: meetups and other in-person events
# An entry lives in `upcoming_events` while it is ahead and moves to
# `past_events` once it has taken place; its page stays the same.

# The cards on /initiatives/, one per subpage.
sections:
  - title: 'Mentorship'
    title_it: 'Mentorship'
    description: 'A 12-week program that connects people who want to enter AI safety with people who already work in it.'
    description_it: "Un programma di 12 settimane che mette in contatto chi vuole entrare nell'AI safety con chi ci lavora già."
    link: '/mentorship/'
    link_text: 'Discover the program →'
    link_text_it: 'Scopri il programma →'
  - title: 'Seminars'
    title_it: 'Seminari'
    description: 'A series of talks on AI safety, ethics and governance, open to everyone. Registration on Luma.'
    description_it: "Un ciclo di talk su sicurezza, etica e governance dell'IA, aperto a tutti. Iscrizioni su Luma."
    link: '/seminars/'
    link_text: 'See the seminars →'
    link_text_it: 'Vedi i seminari →'
  - title: 'Events'
    title_it: 'Eventi'
    description: 'Meetups and in-person gatherings of the community, in Italian cities.'
    description_it: 'Meetup e incontri in presenza della community, nelle città italiane.'
    link: '/events/'
    link_text: 'See the events →'
    link_text_it: 'Vedi gli eventi →'

