  - id: 4
    anchor: 'meetup-milano-2026'
    # featured: true puts this event at the top of the home page (hero notice and
    # its own band). Remove it once the event is over.
    featured: true
    teaser: 'First in-person meetup · Milan, 5 October'
    teaser_it: 'Primo meetup in presenza · Milano, 5 ottobre'
    place: 'Cascina Cuccagna, Milan'
    place_it: 'Cascina Cuccagna, Milano'
    summary: 'An evening open to everyone: a clear introduction to AI safety, the community''s new projects and how to get involved, then aperitivo and networking. No technical background needed. Registration on Luma is required to attend in person; the talks are also livestreamed.'
    summary_it: "Una serata aperta a tutti: un'introduzione chiara all'AI safety, i nuovi progetti della community e come partecipare, poi aperitivo e networking. Non servono conoscenze tecniche. Per venire in presenza è necessaria l'iscrizione su Luma; i talk sono anche in streaming."
    category: 'seminar'
    title: 'AI Safety for Italy Meetup'
    title_it: 'Meetup AI Safety for Italy'
    date: 'Monday 5 October 2026, 18:00–20:30'
    date_it: 'Lunedì 5 ottobre 2026, 18:00–20:30'
    status: 'Upcoming'
    status_it: 'In arrivo'
    # A description written as blocks (<p>, <ul>) is rendered as is; plain text gets its own <p>.
    description: |
      <p>Have you ever wondered how we can make sure artificial intelligence stays safe and beneficial for everyone? Whether you already work in the field or are just getting started, this evening is for you. No technical knowledge required: curiosity is all you need.</p>
      <p>AI Safety for Italy is the Italian community founded in January 2026, now bringing together more than 50 people interested in AI research, policy and ethics. This is our first in-person meetup, open to anyone who wants to join.</p>
      <p><strong>What the evening offers:</strong></p>
      <ul>
        <li>A clear introduction to AI safety: what it's about, why it matters and where to start.</li>
        <li>Plenty of concrete ways to get involved, from the mentorship program to the new local groups, with more projects on the way.</li>
        <li>New connections: after the talks we move on to the aperitivo, to talk about AI over a drink with people who share the same interests.</li>
      </ul>
      <p><strong>In Milan?</strong> Join us in person: the best part of the evening is meeting face to face. To attend in person you need to <a href="https://luma.com/jcx4jd7z" target="_blank" rel="noopener noreferrer">register on Luma</a>.<br><strong>Can't make it?</strong> You can follow the talks via <a href="/streaming" target="_blank" rel="noopener noreferrer">livestream</a>.</p>
    description_it: |
      <p>Ti sei mai chiesto come possiamo assicurarci che l'intelligenza artificiale resti sicura e utile per tutti? Che tu ci lavori già o ti stia solo avvicinando al tema, questa serata è pensata per te. Non servono conoscenze tecniche: basta la curiosità.</p>
      <p>AI Safety for Italy è la community italiana nata a gennaio 2026 che oggi riunisce più di 50 persone interessate a ricerca, policy ed etica dell'IA. Questo è il primo incontro in presenza, aperto a chiunque voglia unirsi.</p>
      <p><strong>Cosa offre la serata:</strong></p>
      <ul>
        <li>Un'introduzione chiara all'AI safety: di cosa si occupa, perché è importante e da dove iniziare.</li>
        <li>Tanti modi concreti per mettersi in gioco, dal programma di mentorship ai nuovi gruppi locali, e altri progetti in arrivo.</li>
        <li>Nuove conoscenze: dopo gli interventi ci si sposta all'aperitivo, per parlare di IA davanti a un drink con persone che condividono gli stessi interessi.</li>
      </ul>
      <p><strong>Sei a Milano?</strong> Vieni in presenza: il bello della serata è conoscersi di persona. Per partecipare in presenza è necessaria l'<a href="https://luma.com/jcx4jd7z" target="_blank" rel="noopener noreferrer">iscrizione su Luma</a>.<br><strong>Non riesci a esserci?</strong> Puoi seguire gli interventi in <a href="/streaming" target="_blank" rel="noopener noreferrer">streaming online</a>.</p>
    format_info:
      - label: 'Format'
        label_it: 'Formato'
        value: 'Talks with Q&A, in person and livestreamed, followed by in-person networking'
        value_it: 'Talk con Q&A in presenza e in streaming, seguiti da networking dal vivo'
      - label: 'Where'
        label_it: 'Dove'
        value: 'Cascina Cuccagna, Via Privata Cuccagna 2/4, Milan'
        value_it: 'Cascina Cuccagna, Via Privata Cuccagna 2/4, Milano'
