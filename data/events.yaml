upcoming_events:
  - id: 1
    anchor: 'mentorship-program'
    category: 'mentorship'
    # featured: true puts this entry in the card beside the home page hero; only
    # the first featured entry is shown. Move it to the next event when one is
    # announced. The `hero` block holds what that card says.
    featured: true
    # Used by the announcement bar only when data/global.yaml lists no announcements.
    teaser: 'Open call for mentors and mentees · first edition from 15 December'
    teaser_it: 'Call aperta per mentor e mentee · prima edizione dal 15 dicembre'
    hero:
      label: 'Open call'
      label_it: 'Call aperta'
      meta: 'Free · Online · 12 weeks'
      meta_it: 'Gratuito · Online · 12 settimane'
      # No day / month here: the calendar badge is for events, and the open call
      # is not one. Add them back (e.g. day: '5', month: 'Oct') for an event.
      title: 'AI Safety for Italy Mentorship Program'
      title_it: 'Programma di mentorship AI Safety for Italy'
      lines:
        - text: 'Mentor applications close 20 October 2026'
          text_it: 'Chiusura candidature mentor: 20 ottobre 2026'
        - text: 'First edition, 15 December 2026 – 15 March 2027'
          text_it: 'Prima edizione, 15 dicembre 2026 – 15 marzo 2027'
      summary: 'The program connects people who want to enter the field of AI safety, ethics and governance with people who already work in it, in Italy and abroad.'
      summary_it: "Il programma mette in contatto chi vuole entrare nel campo della sicurezza, dell'etica e della governance dell'intelligenza artificiale con persone che ci lavorano già, in Italia e all'estero."
      details_text: 'Tracks, requirements and key dates →'
      details_text_it: 'Percorsi, requisiti e date principali →'
      details_link: '/mentorship/'
      primary_text: 'Express your interest'
      primary_text_it: 'Manifesta il tuo interesse'
      # Same form as links.interest_form in data/mentorship.yaml.
      primary_link: 'https://forms.gle/eopxRMZVf7gK5XPW7'
      secondary_text: 'Key dates'
      secondary_text_it: 'Date principali'
      secondary_link: '/mentorship/#timeline'
    title: 'AI Safety for Italy Mentorship Program: Open Call'
    title_it: 'Programma di mentorship AI Safety for Italy: call aperta'
    date: 'First edition, 15 December 2026 – 15 March 2027'
    date_it: 'Prima edizione, 15 dicembre 2026 – 15 marzo 2027'
    status: 'Open call'
    status_it: 'Call aperta'
    # Official wording from the mentorship team, kept in sync with data/mentorship.yaml.
    description: "The AI Safety for Italy mentorship program connects people who want to enter the field of AI safety, ethics and governance with people who already work in it, in Italy and abroad. The goal is to lower the barrier to entry for those who have no one around them working on AI safety, to produce concrete work that stays with the community, and to build lasting connections between people working in this field inside and outside Italy."
    description_it: "Il programma di mentorship di AI Safety for Italy mette in contatto chi vuole entrare nel campo della sicurezza, dell'etica e della governance dell'intelligenza artificiale con persone che ci lavorano già, in Italia e all'estero. L'obiettivo è abbassare la barriera d'ingresso per chi non ha nel proprio ambiente persone che si occupano di AI safety, produrre lavoro concreto che resti alla comunità e costruire connessioni durature tra chi lavora in questo campo dentro e fuori dall'Italia."
    format_info:
      - label: 'Tracks'
        label_it: 'Percorsi'
        value: 'Career orientation (with CePTE) or AI safety projects'
        value_it: 'Orientamento professionale (con CePTE) o progetti di AI safety'
      - label: 'Duration'
        label_it: 'Durata'
        value: '12 weeks, online'
        value_it: '12 settimane, online'
      - label: 'Places'
        label_it: 'Posti'
        value: 'Between 10 and 20 in total'
        value_it: 'Tra 10 e 20 in totale'
      - label: 'Expression of interest'
        label_it: 'Manifestazione di interesse'
        value: 'Open now; mentor applications close 20 October 2026, mentee applications open 1 November 2026'
        value_it: 'Aperta ora; chiusura candidature mentor 20 ottobre 2026, apertura candidature mentee 1 novembre 2026'
    register_text: 'Tracks, requirements and key dates'
    register_text_it: 'Percorsi, requisiti e date principali'
    register_link: '/mentorship/'
    register_target: '_self'

  # Seminar series, every other Thursday at 18:30. Once a seminar has taken
  # place, move it to `past_events` and set status to 'Past' / 'Concluso'.
  # TODO (29 Oct, 12 Nov): add place, a short description and the Luma link
  # (register_text / register_link / register_target: '_blank'), as in the first one.
  - id: 5
    # Anchor from the working title "The Direction of Refusal", kept so links stay valid.
    anchor: 'seminar-direction-of-refusal'
    category: 'seminar'
    title: 'How to Steer the Behavior of a Model: The Refusal Case'
    title_it: 'How to Steer the Behavior of a Model: The Refusal Case'
    date: 'Thursday 15 October 2026, 18:30 (CEST)'
    date_it: 'Giovedì 15 ottobre 2026, ore 18:30 (CEST)'
    status: 'Upcoming'
    status_it: 'In programma'
    description: '<p>The first seminar of the series, on one of the most interesting topics in AI safety research: <strong>mechanistic interpretability</strong>.</p><p>When a large language model refuses a request, what actually happens inside it? Can we identify the mechanisms behind this behaviour and intervene on them directly? Through a practical example on refusal behaviour, we will see how mechanistic interpretability can help us understand how LLMs work inside, and change how they behave.</p>'
    description_it: "<p>Il primo seminario del ciclo, su uno dei temi più interessanti della ricerca sull'AI safety: la <strong>mechanistic interpretability</strong>.</p><p>Quando un large language model rifiuta una richiesta, cosa succede realmente al suo interno? Possiamo identificare i meccanismi responsabili di questo comportamento e intervenire direttamente su di essi? Attraverso un esempio pratico legato al refusal behavior, vedremo come la mechanistic interpretability possa aiutarci a comprendere meglio il funzionamento interno degli LLM e a modificarne il comportamento.</p>"
    format_info:
      - label: 'Speaker'
        label_it: 'Relatore'
        value: 'Enrico Bottazzi, a researcher with a background in cryptography who now works on mechanistic interpretability'
        value_it: 'Enrico Bottazzi, ricercatore con un background in crittografia che oggi si occupa di mechanistic interpretability'
      - label: 'Where'
        label_it: 'Dove'
        value: 'Online, on Zoom (link sent after registration)'
        value_it: 'Online, su Zoom (link inviato dopo la registrazione)'
      - label: 'Who it is for'
        label_it: 'Per chi'
        value: 'Researchers, students, professionals and anyone curious'
        value_it: 'Ricercatori, studenti, professionisti e chiunque sia curioso'
    register_text: 'Register for free on Luma'
    register_text_it: 'Registrazione gratuita su Luma'
    register_link: 'https://luma.com/k1yogh3v'
    register_target: '_blank'

  - id: 6
    anchor: 'seminar-watermarking'
    category: 'seminar'
    title: 'Watermarking in AI-Generated Text'
    title_it: 'Watermarking in AI-Generated Text'
    date: 'Thursday 29 October 2026, 18:30'
    date_it: 'Giovedì 29 ottobre 2026, 18:30'
    status: 'Upcoming'
    status_it: 'In programma'
    format_info:
      - label: 'Speaker'
        label_it: 'Relatore'
        value: 'Carlo Martinucci'
        value_it: 'Carlo Martinucci'

  - id: 7
    anchor: 'seminar-geometric-interpretability'
    category: 'seminar'
    title: 'Geometric Approaches to Interpretability'
    title_it: 'Geometric Approaches to Interpretability'
    date: 'Thursday 12 November 2026, 18:30'
    date_it: 'Giovedì 12 novembre 2026, 18:30'
    status: 'Upcoming'
    status_it: 'In programma'
    format_info:
      - label: 'Speaker'
        label_it: 'Relatrice'
        value: 'Elisabetta Rocchetti'
        value_it: 'Elisabetta Rocchetti'

