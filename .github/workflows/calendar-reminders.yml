# Sends the calendar's reminders and Discord announcements that are due, every
# 10 minutes, on the live site. See server/calendar-reminders.js. GitHub may
# start a scheduled run some minutes late; a reminder is still sent up to 30
# minutes after its time. Needs the repository secret CRON_SECRET, the same
# value as the CRON_SECRET environment variable on Vercel (production).
name: Calendar reminders

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: calendar-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send the reminders that are due
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set: nothing to do."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "https://www.ais4i.it/api/cron/cleanup?job=reminders" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'
