# Compares the members board with the Discord server once a day, and tells
# whoever follows the board what changed there by hand.
# See driftCheck in server/community.js. Needs the repository secret CRON_SECRET, the same
# value as the CRON_SECRET environment variable on Vercel (production).
name: Discord check

on:
  schedule:
    # 06:10 UTC daily, off the hour (GitHub's scheduler queues on the hour).
    - cron: '10 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare the board with Discord
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set: nothing to do."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST "https://www.ais4i.it/api/cron/discord-check" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'
