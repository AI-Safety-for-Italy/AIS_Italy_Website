# Deletes the personal data past its keeping time (24 months: form answers,
# member applications never approved), once a day, on the live site.
# See server/retention.js. Needs the repository secret CRON_SECRET, the same
# value as the CRON_SECRET environment variable on Vercel (production).
name: Retention cleanup

on:
  schedule:
    # 03:40 UTC daily, off the hour (GitHub's scheduler queues on the hour).
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete what is past its keeping time
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set: nothing to do."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "https://www.ais4i.it/api/cron/cleanup" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'
