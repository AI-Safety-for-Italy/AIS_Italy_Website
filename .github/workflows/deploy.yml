name: CI

# `pull_request` with no `branches` filter fires for a PR against any base
# branch, so the checks below gate every PR, not only the ones targeting main.
# `dev` is listed alongside `main` so that the deploy job below can be exercised
# on a throwaway preview URL before it is ever responsible for the live domain.
# `design-improvements` gets its own preview too, to share the redesign
# without touching dev.
# `workflow_dispatch` lets the content tool (/app/content/) rebuild the site
# after a seminar or event is published: it runs this workflow on main (or dev
# for the previews) through server/content-publish.js.
on:
  push:
    branches: [main, dev, design-improvements]
  pull_request:
  workflow_dispatch:

jobs:
  # Named `checks` because this is what branch protection should require. Keep
  # it separate from deploy: a formatting failure must block a merge, and a
  # deploy step must never be what decides whether a PR is mergeable.
  checks:
    name: Build and format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build site
        run: npm run build

      - name: Test meeting polls
        run: npm run test:meet

  deploy:
    name: Deploy ${{ github.ref_name }}
    needs: checks
    # Pushes and the content tool's rebuilds; never pull requests. On a
    # pull_request event the checked-out tree is a merge commit that exists on
    # neither branch, so deploying it would publish something no branch
    # actually points at.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    # Keyed per ref so a dev deploy and a main deploy never cancel each other,
    # while two pushes to the same branch still collapse to the newer commit.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true

    # The Vercel CLI reads these from the environment to know which account and
    # project it is acting on, so no `.vercel` directory is committed.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Only `main` publishes to the production alias, which is the alias a
      # custom domain follows. Every other branch lands on a preview URL that
      # nothing points at, so running this job from dev is inert by design.
      # content_source: the site whose /api/content the build reads the
      # seminars and events published from the dashboard from (see
      # server/content-build.js); empty elsewhere, so the YAML is used.
      - name: Resolve deploy target
        id: target
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
            echo "content_source=https://www.ais4i.it" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
              echo "content_source=https://ais4i-dev.vercel.app" >> "$GITHUB_OUTPUT"
            else
              echo "content_source=" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Writes the project settings from vercel.json and the dashboard into
      # .vercel/, so the build below uses the same configuration a deploy
      # triggered from the Vercel dashboard would.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=${{ steps.target.outputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}

      # Building here rather than on Vercel keeps the artifact that ships
      # identical to the one this workflow produced, and lets the deploy step
      # use --prebuilt to skip a second build.
      - name: Build
        env:
          CONTENT_SOURCE: ${{ steps.target.outputs.content_source }}
        run: vercel build ${{ steps.target.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ${{ steps.target.outputs.environment }} to $url"
          echo "Deployed \`${{ steps.target.outputs.environment }}\` to $url" >> "$GITHUB_STEP_SUMMARY"

      # Each preview gets its own URL, so dev also gets a fixed alias that always
      # follows its latest deploy: one link to share before merging into main.
      - name: Point the dev alias at this deploy
        if: github.ref == 'refs/heads/dev'
        run: |
          vercel alias set "${{ steps.deploy.outputs.url }}" ais4i-dev.vercel.app --token=${{ secrets.VERCEL_TOKEN }}
          echo "Aliased to https://ais4i-dev.vercel.app" >> "$GITHUB_STEP_SUMMARY"

      # Same idea for the redesign branch, on its own fixed address.
      - name: Point the redesign alias at this deploy
        if: github.ref == 'refs/heads/design-improvements'
        run: |
          vercel alias set "${{ steps.deploy.outputs.url }}" ais4i-redesign.vercel.app --token=${{ secrets.VERCEL_TOKEN }}
          echo "Aliased to https://ais4i-redesign.vercel.app" >> "$GITHUB_STEP_SUMMARY"
