name: CI

# `pull_request` with no `branches` filter fires for a PR against any base
# branch, so the checks below gate every PR, not only the ones targeting main.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Named `checks` because this is what branch protection should require. Keep
  # it separate from deploy: a formatting failure must block a merge, and a
  # deploy step must never be what decides whether a PR is mergeable.
  checks:
    name: Build and format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build site
        run: npm run build

  deploy:
    name: Deploy to production
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: |
          # Production hosting is driven by vercel.json, so there is nothing to
          # push from here yet. Add real deployment steps in this job.
          echo "Deploying to production..."
