# Color Palette Configuration
# All colors used across the website
# Palette derived from the AIS4I logo: Italian-flag green + red,
# with green-tinted neutrals.

# Brand Colors
brand:
  primary: "#008C45"
  primaryDark: "#006F38"
  secondary: "#CD212A"
  accent: "#CD212A"

# Semantic Colors
semantic:
  # Action colors
  info: "#008C45"
  success: "#16a34a"
  warning: "#f59e0b"
  error: "#CD212A"

  # State colors
  active: "#008C45"
  hover: "#006F38"
  focus: "#2FBF71"
  disabled: "#9ca3af"

# Custom Named Colors
custom:
  safety-green: "#008C45"
  safety-red: "#CD212A"
  accent-emerald: "#2FBF71"

# Neutral Colors (green-tinted grayscale)
neutral:
  50: "#f7faf8"
  100: "#eef4f0"
  200: "#e2eae5"
  300: "#c7d6cc"
  400: "#9db3a6"
  500: "#6b7d73"
  600: "#43544b"
  700: "#2c3d34"
  800: "#1b2a21"
  900: "#14201a"

# Background Colors
background:
  light:
    primary: "#FCFDFC"
    secondary: "#F3F7F4"
    tertiary: "#E7F4EC"
    card: "#ffffff"
    elevated: "#ffffff"
  dark:
    primary: "#0E1512"
    secondary: "#152019"
    tertiary: "#1B2A21"
    card: "#152019"
    elevated: "#1B2A21"

# Text Colors
text:
  light:
    primary: "#14201A"
    secondary: "#43544B"
    tertiary: "#6B7D73"
    muted: "#8A9C91"
    inverse: "#ffffff"
  dark:
    primary: "#E9F0EB"
    secondary: "#B4C4BA"
    tertiary: "#8A9C91"
    muted: "#64766B"
    inverse: "#0E1512"

# Border Colors
border:
  light:
    default: "#E2EAE5"
    strong: "#C7D6CC"
    subtle: "#EDF3EF"
  dark:
    default: "#24342B"
    strong: "#35483C"
    subtle: "#1B2A21"

# Gradient Definitions
gradients:
  primary:
    from: "#008C45"
    to: "#005C2E"
    direction: "to right"

  accent:
    from: "#008C45"
    to: "#CD212A"
    direction: "to right"

  hero:
    light:
      from: "#E7F4EC"
      to: "#FBECEA"
    dark:
      from: "#0E1512"
      to: "#152019"

# Opacity Variants
opacity:
  transparent: "rgba(255, 255, 255, 0)"
  subtle: "rgba(0, 0, 0, 0.05)"
  light: "rgba(0, 0, 0, 0.1)"
  medium: "rgba(0, 0, 0, 0.3)"
  strong: "rgba(0, 0, 0, 0.5)"
  solid: "rgba(0, 0, 0, 1)"
